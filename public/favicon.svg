<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00e65c" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  
  <!-- Dark Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="#00e65c" stroke-width="12" stroke-opacity="0.8"/>
  
  <!-- Brand Monogram 'PS' -->
  <g transform="translate(48, 64)">
    <!-- 'P' in Neon Green -->
    <path d="M 90 80 L 170 80 C 230 80 260 110 240 170 C 220 230 180 250 120 250 L 80 250 L 50 360 L 10 360 L 90 80 Z M 115 130 L 80 200 L 130 200 C 160 200 180 190 190 160 C 200 130 180 130 150 130 L 115 130 Z" 
          fill="#00e65c" 
          filter="url(#glow)"/>
          
    <!-- 'S' in Bright White -->
    <path d="M 360 130 C 320 130 270 150 250 200 L 290 200 C 300 170 330 160 350 160 C 370 160 380 170 375 185 C 370 200 340 210 300 225 C 240 245 220 275 230 315 C 240 360 290 380 340 380 C 390 380 430 360 445 310 L 405 310 C 395 335 370 350 340 350 C 315 350 300 340 295 325 C 290 310 310 300 350 285 C 410 265 435 240 425 195 C 415 150 380 130 360 130 Z" 
          fill="#FFFFFF"/>
          
    <!-- Underline Spray Accent -->
    <path d="M 40 395 Q 210 415 420 395" 
          stroke="#00e65c" 
          stroke-width="16" 
          stroke-linecap="round" 
          fill="none" 
          filter="url(#glow)"/>
  </g>
</svg>
